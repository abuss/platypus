# Ported from Nevi theme "rose-pine"
[ui]
breadcrumbs = { fg = "#e0def4" }
completion_sel = { bg = "#26233a" }
current_line_no = { fg = "#e0def4" }
default = { fg = "#e0def4", bg = "#191724" }
diag_error = { fg = "#eb6f92" }
diag_hint = { fg = "#c4a7e7" }
diag_info = { fg = "#9ccfd8" }
diag_warn = { fg = "#f6c177" }
find_match = { fg = "#191724", bg = "#f6c177" }
line_no = { fg = "#6e6a86" }
menu_bg = { bg = "#1f1d2e" }
palette_sel = { bg = "#26233a" }
selection = { bg = "#403d52" }
sidebar_sel = { bg = "#26233a" }
status_bar = { fg = "#e0def4", bg = "#1f1d2e" }
status_mode = { fg = "#ebbcba", bold = true }
tab_active = { fg = "#e0def4", bg = "#1f1d2e", bold = true }
tab_inactive = { fg = "#e0def4" }

[syntax]
attribute = { fg = "#c4a7e7" }
comment = { fg = "#6e6a86", italic = true }
constant = { fg = "#f6c177" }
function = { fg = "#ebbcba" }
"function.method" = { fg = "#ebbcba" }
keyword = { fg = "#31748f" }
label = { fg = "#9ccfd8" }
namespace = { fg = "#9ccfd8" }
number = { fg = "#f6c177" }
operator = { fg = "#908caa" }
property = { fg = "#c4a7e7" }
punctuation = { fg = "#908caa" }
string = { fg = "#f6c177" }
tag = { fg = "#eb6f92" }
type = { fg = "#9ccfd8" }
variable = { fg = "#e0def4" }
